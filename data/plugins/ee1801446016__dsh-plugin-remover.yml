name: ee1801446016/dsh-plugin-remover
category: session
description:
  en: 'Delete a conversation from its row menu together with the files it produced, its subagent conversations, and the attachments no other conversation references, behind a recycle bin that restores a whole group or one file at a time, and keep the conversation while deleting only its files. Files the log shows only as read are listed but never deleted. Its HTTP routes have no DSH access check, so a web page open in your browser could call them.'
  zh: '在会话行的菜单里删除一个对话，并带走它产出的文件、它的子代理对话，以及没有其他对话引用的附件；删除先进回收站，可整组恢复或只恢复一个文件，也可以只删文件、留下对话。日志里只是读过的文件只列出、不删除。它的 HTTP 路由没有 DSH 的访问检查，浏览器里打开的网页可以调用它们。'
icon: https://raw.githubusercontent.com/ee1801446016/dsh-plugin-remover/main/assets/icon-180.png
